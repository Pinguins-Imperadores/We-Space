[package]
name = "wespace-shared-types"
version = "0.1.0"
edition = "2021"
description = "Shared types and models for We Space backend and client"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
