[package]
name = "wespace-api"
version = "0.1.0"
edition = "2021"
description = "We Space High-Performance Modular Monolith Backend (Axum + Tokio)"

[dependencies]
axum = { version = "0.8", features = ["ws", "macros", "multipart"] }
tokio = { version = "1.38", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["cors", "trace", "timeout", "compression-full"] }
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "uuid"] }
fred = { version = "10.1", features = ["subscriber-client", "enable-rustls"] }
async-nats = "0.51"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
jsonwebtoken = "11.1"
argon2 = { version = "0.6", features = ["std"] }
rand = "0.8"
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
dotenvy = "0.15"
futures-util = "0.3"
tokio-stream = "0.1"
shared-types = { package = "wespace-shared-types", path = "../shared-types" }
