app = "wespace-api-prod"
primary_region = "gru"
kill_signal = "SIGINT"
kill_timeout = "15s"

[build]
  dockerfile = "infra/docker/Dockerfile.api"

[env]
  RUST_LOG = "info,wespace_api=debug,tower_http=info"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    hard_limit = 5000
    soft_limit = 4000

  [[http_service.checks]]
    interval = "15s"
    timeout = "3s"
    grace_period = "5s"
    method = "GET"
    path = "/api/v1/healthcheck"

[[vm]]
  size = "shared-cpu-2x"
  memory = "1gb"
