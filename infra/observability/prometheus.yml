global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "wespace-api"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["host.docker.internal:8080"]

  - job_name: "otel-collector"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: "nats"
    static_configs:
      - targets: ["nats:8222"]
