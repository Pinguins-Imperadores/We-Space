# We Space Hardened Coturn Configuration
# Portas de escuta
listening-port=3478
tls-listening-port=5349
min-port=49152
max-port=65535

# Identidade e Autenticação Efêmera (Time-Limited HMAC-SHA1)
fingerprint
lt-cred-mech
use-auth-secret
static-auth-secret=dev_turn_hmac_secret_32bytes_min!
realm=turn.wespace.gg

# Quotas e Limitação de Banda por Sessão de Voz (Áudio Opus ~64kbps; teto 128kbps)
total-quota=500
user-quota=4
max-bps=131072
bps-capacity=104857600

# Hardening de Segurança (Crítico contra Relay Abuse / SSRF)
no-multicast-peers
no-loopback-peers
no-cli
stale-nonce=600
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
