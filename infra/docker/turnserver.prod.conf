# We Space Production Coturn Configuration (South America / sa-east-1 — CG-NAT Bypass)
# Portas de escuta STUN/TURN (UDP/TCP) e TURNS (TLS/DTLS)
listening-port=3478
tls-listening-port=5349
min-port=49160
max-port=49200

# Mapeamento NAT 1:1 obrigatório em VMs de nuvem (AWS sa-east-1 / GCP southamerica-east1 / Oracle SP)
# Formato: external-ip=<IP_PUBLICO>/<IP_PRIVADO_DA_INTERFACE>
external-ip=__EXTERNAL_IP__/__INTERNAL_IP__

# Identidade e Autenticação Efêmera (Time-Limited HMAC-SHA1)
fingerprint
use-auth-secret
static-auth-secret=__TURN_HMAC_SECRET__
realm=__TURN_REALM__

# Certificados TLS/DTLS de Produção (Let's Encrypt / Cloudflare Origin)
cert=/etc/coturn/certs/fullchain.pem
pkey=/etc/coturn/certs/privkey.pem
no-tlsv1
no-tlsv1_1
cipher-list="ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384"

# Quotas e Limitação de Banda por Sessão de Voz (Áudio Opus ~64kbps; teto 128kbps)
total-quota=500
user-quota=4
max-bps=131072
bps-capacity=104857600

# Hardening de Segurança (Crítico contra Relay Abuse / SSRF)
no-multicast-peers
no-cli
stale-nonce=600
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
